<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - La Geria</title>
    <meta name="description" content="Ponte en contacto con nosotros para resolver tus dudas sobre la visita a La Geria en Lanzarote.">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Formulario de Contacto</h1>
    <h2>¿Tienes alguna duda sobre tu visita?</h2>
    <p>Si quieres saber más sobre las rutas, las bodegas o necesitas cualquier aclaración, déjanos tu mensaje:</p>

    <form action="#" method="POST">
        <p>
            <label for="nombre">Nombre:</label><br>
            <input type="text" id="nombre" name="nombre" required>
        </p>
        <p>
            <label for="correo">Correo electrónico:</label><br>
            <input type="email" id="correo" name="correo" required>
        </p>
        <p>
            <label for="mensaje">Mensaje:</label><br>
            <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
        </p>
        <p>
            <button type="submit">Enviar mensaje</button>
        </p>
    </form>
    <h2>Enlaces</h2>
    <p>Volver a la <a href="index.html">portada principal</a>.</p>
    <p>Consulta los <a href="datos.html">Horarios y Datos prácticos</a>.</p>
</body>
</html>
